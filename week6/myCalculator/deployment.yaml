apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycalc-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mycalc
  template:
    metadata:
      labels:
        app: mycalc
    spec:
      containers:
        - name: mycalc-container
          image: amanmadaan30/mycalc_week6:latest
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: mycalc-service
spec:
  selector:
    app: mycalc
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 31000
  type: NodePort
